<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Plant Disease Classification Using Deep Learning</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <link href="{{ url_for('static', filename='css/test.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/newjs.js') }}" type="text/javascript"></script>
    
    <style>
        body {
            /* Replace 'plant_bg.jpg' with the actual file name of your background image */
            background-image: url("{{ url_for('static', filename='assets/img.png') }}"); 
            background-size: cover; /* Ensures the image covers the entire background */
            background-repeat: no-repeat; /* Prevents the image from tiling */
            background-attachment: fixed; /* Keeps the background static when scrolling */
        }
        
        /* Custom CSS to center the content within the container */
        .navbar .container {
            display: flex;
            justify-content: center; 
            align-items: center; 
            
            
        }

        /* Override the Bootstrap styling for text alignment in the navbar brand */
        .navbar-brand {
            text-align: center !important; 
            width: 100%; 
            color: white !important;
        }

        .navbar
        {
            background-color: green !important;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Plant Disease Classification Using Deep Learning</a>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

</body>

</html>
